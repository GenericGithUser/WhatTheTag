<!DOCTYPE html>
<html>
<head>
  <title>Generate PWA Icons</title>
</head>
<body>
  <h1>PWA Icon Generator</h1>
  <p>This page generates PNG icons from the SVG favicon.</p>
  <canvas id="canvas-192" width="192" height="192"></canvas>
  <canvas id="canvas-512" width="512" height="512"></canvas>
  <div id="downloads"></div>
  
  <script>
    // SVG icon data
    const svgData = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="20" fill="#ebdbb2"/>
      <rect x="20" y="20" width="25" height="25" rx="3" fill="#458588"/>
      <rect x="55" y="20" width="25" height="25" rx="3" fill="#458588"/>
      <rect x="20" y="55" width="25" height="25" rx="3" fill="#458588"/>
      <rect x="58" y="58" width="8" height="8" fill="#d65d0e"/>
      <rect x="70" y="58" width="8" height="8" fill="#d65d0e"/>
      <rect x="58" y="70" width="8" height="8" fill="#d65d0e"/>
      <rect x="70" y="70" width="8" height="8" fill="#d65d0e"/>
    </svg>`;
    
    const svgBlob = new Blob([svgData], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    
    img.onload = function() {
      // Generate 192x192
      const canvas192 = document.getElementById('canvas-192');
      const ctx192 = canvas192.getContext('2d');
      ctx192.drawImage(img, 0, 0, 192, 192);
      
      // Generate 512x512
      const canvas512 = document.getElementById('canvas-512');
      const ctx512 = canvas512.getContext('2d');
      ctx512.drawImage(img, 0, 0, 512, 512);
      
      // Create download links
      const downloads = document.getElementById('downloads');
      
      canvas192.toBlob(function(blob) {
        const link192 = document.createElement('a');
        link192.download = 'icon-192x192.png';
        link192.href = URL.createObjectURL(blob);
        link192.textContent = 'Download 192x192 icon';
        downloads.appendChild(link192);
        downloads.appendChild(document.createElement('br'));
      });
      
      canvas512.toBlob(function(blob) {
        const link512 = document.createElement('a');
        link512.download = 'icon-512x512.png';
        link512.href = URL.createObjectURL(blob);
        link512.textContent = 'Download 512x512 icon';
        downloads.appendChild(link512);
      });
    };
    
    img.src = url;
  </script>
</body>
</html>
